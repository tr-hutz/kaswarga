name: E2E — Production

on:
  schedule:
    # Nightly at 02:00 WIB (UTC+7 → 19:00 UTC previous day)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      notify_on_pass:
        description: 'Send success notification'
        type: boolean
        default: false

concurrency:
  group: e2e-prod
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Supabase — production project
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.PROD_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}

      # App
      NEXT_PUBLIC_SITE_URL:      ${{ secrets.PROD_SITE_URL }}

      # Test accounts (dedicated E2E users in the production test RT)
      E2E_TEST_EMAIL:            ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_TEST_PASSWORD:         ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_EMAIL:           ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD:        ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_CHAIR_EMAIL:           ${{ secrets.E2E_CHAIR_EMAIL }}
      E2E_CHAIR_PASSWORD:        ${{ secrets.E2E_CHAIR_PASSWORD }}
      E2E_TREASURER_EMAIL:       ${{ secrets.E2E_TREASURER_EMAIL }}
      E2E_TREASURER_PASSWORD:    ${{ secrets.E2E_TREASURER_PASSWORD }}
      E2E_RESIDENT_EMAIL:        ${{ secrets.E2E_RESIDENT_EMAIL }}
      E2E_RESIDENT_PASSWORD:     ${{ secrets.E2E_RESIDENT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E suite (production)
        run: npm run test:e2e:prod

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod-${{ github.run_id }}
          path: playwright-report-prod/
          retention-days: 14

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🔴 E2E production suite failed — ${new Date().toISOString().slice(0,10)}`,
              body:  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['e2e', 'production'],
            })
